<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de QR Code Stylé</title>
  
  <!-- 1. Chargement de la bibliothèque via CDN -->
  <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f5f5f5;
      text-align: center;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    input {
      width: 90%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #eee;
    }
    #canvas {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }
    .download-btn {
      background: #000;
      color: #fff;
      padding: 10px 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Générateur de QR Code</h2>
    
    <!-- Champ de saisie -->
    <input type="text" id="qr-input" value="https://google.com" placeholder="Entre ton lien ici">

    <!-- Boutons pour changer de style (Presets) -->
    <div class="btn-group">
      <button onclick="applyPreset('youtube')">YouTube</button>
      <button onclick="applyPreset('telegram')">Telegram</button>
      <button onclick="applyPreset('wifi')">Wi-Fi</button>
    </div>

    <!-- Emplacement où le QR code va s'afficher -->
    <div id="canvas"></div>

    <!-- Bouton de téléchargement -->
    <button class="download-btn" onclick="downloadQR()">Télécharger le PNG</button>
  </div>

  <script>
    // 2. Définition des modèles (Presets)
    const presets = {
      youtube: {
        dotsOptions: { color: "#FF0000", type: "rounded" },
        cornersSquareOptions: { color: "#CC0000", type: "extra-rounded" },
        cornersDotOptions: { color: "#FF0000", type: "dot" },
        image: "https://upload.wikimedia.org/wikipedia/commons/ef/ef0/YouTube_logo_%282017%29.svg"
      },
      telegram: {
        dotsOptions: { color: "#0088cc", type: "dots" },
        cornersSquareOptions: { color: "#0088cc", type: "extra-rounded" },
        cornersDotOptions: { color: "#0088cc", type: "dot" },
        image: "https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg"
      },
      wifi: {
        dotsOptions: { color: "#4A90E2", type: "classy-rounded" },
        cornersSquareOptions: { color: "#1B4F72", type: "extra-rounded" },
        cornersDotOptions: { color: "#1B4F72", type: "dot" },
        image: "https://cdn-icons-png.flaticon.com/512/93/93158.png"
      }
    };

    // 3. Initialisation du QR Code
    const qrCode = new QRCodeStyling({
      width: 250,
      height: 250,
      data: document.getElementById("qr-input").value,
      imageOptions: { margin: 6, hideBackgroundDots: true },
      qrOptions: { errorCorrectionLevel: 'H' } // Essentiel pour scanner facilement avec un logo
    });

    // Affichage dans le div #canvas
    qrCode.append(document.getElementById("canvas"));

    // 4. Fonction pour changer de modèle
    function applyPreset(name) {
      const config = presets[name];
      const textValue = document.getElementById("qr-input").value;

      qrCode.update({
        data: textValue,
        image: config.image,
        dotsOptions: config.dotsOptions,
        cornersSquareOptions: config.cornersSquareOptions,
        cornersDotOptions: config.cornersDotOptions
      });
    }

    // Mettre à jour le QR Code automatiquement quand on tape du texte
    document.getElementById("qr-input").addEventListener("input", (e) => {
      qrCode.update({ data: e.target.value });
    });

    // 5. Fonction pour télécharger la photo
    function downloadQR() {
      qrCode.download({ name: "qr-code", extension: "png" });
    }

    // Appliquer le style YouTube par défaut au chargement
    applyPreset('youtube');
  </script>

</body>
</html>
